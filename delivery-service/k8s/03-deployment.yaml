apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: delivery-service
  labels:
    app: delivery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
        - name: delivery-service
          image: delivery-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: DB_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: ORDER_SERVICE_URL
            - name: DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: DDL_AUTO
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: LOG_LEVEL
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: delivery-service-config
                  key: JAVA_OPTS
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: delivery-service-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: delivery-service-secret
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

