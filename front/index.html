<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order System - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>🍕 Food Order System</h1>
            <h2>Iniciar Sesión</h2>

            <div id="error-message" class="error hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">📧 Email:</label>
                    <input type="email" id="email" name="email" value="admin@admin.com" required>
                </div>

                <div class="form-group">
                    <label for="password">🔐 Contraseña:</label>
                    <input type="text" id="password" name="password" value="admin123" required>
                </div>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>

            <div class="info-box">
                <h3>Usuarios de prueba:</h3>
                <p><strong>Admin:</strong> admin@admin.com / admin123</p>
                <p><strong>Usuario:</strong> test@test.com / test123</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
