<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Food Order System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>🍕 Food Order System</h1>
            <div class="nav-right">
                <a href="catalog.html" class="btn btn-secondary">← Volver al Catálogo</a>
                <button id="logout-btn" class="btn btn-secondary">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>💳 Finalizar Pedido</h2>

        <div id="error-message" class="error hidden"></div>
        <div id="success-message" class="success hidden"></div>

        <div class="checkout-container">
            <div class="checkout-left">
                <h3>Resumen del Pedido</h3>
                <div id="order-summary"></div>
                <div class="order-total">
                    <h3>Total: $<span id="order-total">0.00</span></h3>
                </div>
            </div>

            <div class="checkout-right">
                <h3>Detalles de Entrega y Pago</h3>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="delivery-address">📍 Dirección de Entrega:</label>
                        <textarea id="delivery-address" name="delivery-address" rows="3" required>Av. Principal 123, Lima</textarea>
                    </div>

                    <div class="form-group">
                        <label>💰 Método de Pago:</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="payment-method" value="CASH" checked> 💵 Efectivo
                            </label>
                            <label>
                                <input type="radio" name="payment-method" value="CARD"> 💳 Tarjeta
                            </label>
                            <label>
                                <input type="radio" name="payment-method" value="ONLINE"> 🌐 Pago Online
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large">Confirmar y Pagar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
