apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-order-ingress
  namespace: food-order
  annotations:
    # Indica que usamos Nginx como Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    # Reescribe la URL antes de enviarla al servicio
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Timeout de conexión
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Tamaño máximo del body (para payloads de pedidos)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - http:
        paths:
          # ── USER SERVICE ──────────────────────────────────────
          # Rutas públicas de autenticación (sin JWT)
          - path: /api/users(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8081

          # ── CATALOG SERVICE ───────────────────────────────────
          # Ver restaurantes y menús (público)
          - path: /api/restaurants(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8082

          - path: /api/menu-items(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8082

          # ── ORDER SERVICE ─────────────────────────────────────
          # Crear y consultar pedidos (requiere JWT)
          - path: /api/orders(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8083

          # ── DELIVERY SERVICE ──────────────────────────────────
          # Gestión de entregas (requiere JWT)
          - path: /api/deliveries(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: delivery-service
                port:
                  number: 8084

          # ── PAYMENT SERVICE ───────────────────────────────────
          # Gestión de pagos (requiere JWT)
          - path: /api/payments(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8085

