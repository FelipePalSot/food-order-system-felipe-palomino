apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: payment-service
  labels:
    app: payment-service
data:
  DB_URL: "jdbc:postgresql://host.docker.internal:5437/paymentdb"
  ORDER_SERVICE_URL: "http://order-service.order-service.svc.cluster.local"
  DDL_AUTO: "validate"
  SHOW_SQL: "false"
  POOL_SIZE: "10"
  LOG_LEVEL: "INFO"
  JAVA_OPTS: "-Xmx512m -Xms256m"

